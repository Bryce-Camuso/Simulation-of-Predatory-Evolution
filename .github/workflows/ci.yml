name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Class-level tester validation
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.14.4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==3.0.3

      - name: Verify documentation artifacts exist
        run: |
          if (-not (Test-Path README.md)) { throw 'README.md not found' }
          if (-not (Test-Path documents/PRD.md)) { throw 'documents/PRD.md not found' }
          if (-not (Test-Path documents/Software-Test-Plan-and-Report.md)) { throw 'documents/Software-Test-Plan-and-Report.md not found' }

      - name: Display runtime environment
        run: |
          python --version
          Write-Output "Python executable: $(Get-Command python).Source"
          python -c "import pandas as pd; print('pandas', pd.__version__)"

      - name: Run class-level tester modules
        run: |
          python classes/Animal.py
          python classes/Bird.py
          python classes/Map.py
          python classes/Mouse.py
          python classes/Plant.py
          python classes/Predator.py
          python classes/Prey.py
          python classes/Rabbit.py
          python classes/Scent.py
